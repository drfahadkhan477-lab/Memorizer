name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pure:
    name: pure — logic suites, no browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, America/New_York]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
      - name: Memorizer builds into one file
        run: |
          node scripts/build-memorizer.js --out "$RUNNER_TEMP/memorizer"
          test -s "$RUNNER_TEMP/memorizer/index.html"
          node --check "$RUNNER_TEMP/memorizer/sw.js"
      - run: npm run test:pure

  browser:
    name: browser — the whole app in ${{ matrix.engine }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001 --ipc=host
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]
    env:
      SYSTOLE_ENGINE: ${{ matrix.engine }}
      SYSTOLE_TEST_READERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run test:prepare
      - if: ${{ !cancelled() }}
        run: node tests/verify-memorizer.js
      - if: ${{ !cancelled() }}
        run: node tests/verify-memorizer-hardening.js
      - if: ${{ !cancelled() }}
        run: node tests/verify-memorizer-studyimport.js
      - if: ${{ !cancelled() }}
        run: node tests/verify-memorizer-offline.js
      - if: ${{ !cancelled() }}
        run: node tests/verify-memorizer-data.js
